/* ---------- math ---------- */

 const c=t==='CE',p=c?S*N(d1)-e*N(d2):e*N(-d2)-S*N(-d1),dl=c?N(d1):N(d1)-1,th=(-S*pdf(d1)*s/(2*Math.sqrt(T))+(c?-r*e*N(d2):r*e*N(-d2)))/365;return{p:Math.max(p,.05),d:dl,t:th}}

 return{spot:d.spot,chg:(d.spot/d.closes.at(-1)-1)*100,vix:d.vix,exp:fe(ex),expTs:+ex,dte,closes:d.closes,rows,marks:{}}}

 const g=await api('/rest/secure/angelbroking/marketData/v1/optionGreeks',{name:k,expirydate:ex.e}),gm={};(g.data||[]).forEach(x=>gm[+x.strikePrice+x.optionType]=x);

/* ---------- analysis engine ---------- */
function analyze(k,s){const cs=[...s.closes,s.spot],e20=ema(cs,20),e50=ema(cs,50),R=rsi(cs),mom=cs.length>5?(s.spot/cs.at(-6)-1)*100:0;
 let t=(s.spot>e20?1:-1)+(e20>e50?1:-1)+(R>55?1:R<45?-1:0)+(mom>.5?1:mom<-.5?-1:0);const tech=t/4;
 const rows=s.rows,ce=rows.reduce((a,r)=>a+(r.CE?r.CE.oi:0),0),pe=rows.reduce((a,r)=>a+(r.PE?r.PE.oi:0),0),pcr=ce?pe/ce:1;
 let mp=rows[0]?rows[0].K:0,best=1e30;for(const X of rows){let p=0;for(const r of rows)p+=(r.CE?r.CE.oi:0)*Math.max(0,X.K-r.K)+(r.PE?r.PE.oi:0)*Math.max(0,r.K-X.K);if(p<best){best=p;mp=X.K}}

 const fund=(pcr>1.2?1:pcr<.8?-1:0)*.6+(s.spot<mp?.4:-.4)*.5+(s.vix<13?0:0),bias=.6*tech+.4*fund,regime=bias>=.2?'UPTREND':bias<=-.2?'DOWNTREND':'SIDEWAYS';
 const atmRow=rows.reduce((a,r)=>Math.abs(r.K-s.spot)<Math.abs(a.K-s.spot)?r:a,rows[0]||{K:0}),atmIv=((atmRow.CE&&atmRow.CE.iv)||(atmRow.PE&&atmRow.PE.iv)||s.vix),em=s.spot*atmIv/100*Math.sqrt(Math.max(s.dte,.5)/365);
 const ctx={tech,fund,bias,regime,pcr,mp,res,sup,e20,e50,R,mom,em,atmIv,picks:[],rej:0};if(regime==='SIDEWAYS'||!rows.length)return ctx;
 const side=bias>0?'CE':'PE',dir=bias>0?1:-1,os=rows.map(r=>r[side]).filter(Boolean),mIv=med(os.map(o=>o.iv)),mOi=med(os.map(o=>o.oi)),sorted=[...os].sort((a,b)=>a.oi-b.oi);
 for(const r of rows){const o=r[side];if(!o)continue;const dl=Math.abs(o.delta);if(dl<.3||dl>.65)continue;const be=side==='CE'?r.K+o.ltp:r.K-o.ltp,thp=Math.abs(o.theta)/o.ltp;

/* ---------- paper trading ---------- */
function pnl(t){const ex=t.status==='OPEN'?t.ltp:t.exit,g=(ex-t.entry)*t.qty,fb=fees(t.entry,t.qty,'B'),fs=fees(ex,t.qty,'S');return{ex,g,fb,fs,fee:fb.total+fs.total,net:g-fb.total-fs.total}}

 $('#tabs').innerHTML=[['picks','Auto Picks'],['paper','Paper Trading ('+TR.filter(t=>t.status==='OPEN').length+' open)'],['set','Settings / Angel One']].map(([id,l])=>`<button class="${TAB===id?'on':''}" onclick="TAB='${id}';renderAll(1)">${l}</button>`).join('');
 const V=$('#view');if(TAB==='set'&&!force&&V.dataset.t==='set')return;V.innerHTML=TAB==='picks'?vPicks():TAB==='paper'?vPaper():vSet();V.dataset.t=TAB}
function vPicks(){let h='<div class="grid">'+['ALL',...Object.keys(IDX)].map(k=>{if(k==='ALL')return`<div class="card ov ${FILT==='ALL'?'sel':''}" onclick="FILT='ALL';renderAll()"><b>All indices</b><div class="mu">${Object.values(CTX).reduce((a,c)=>a+c.picks.length,0)} qualified picks</div></div>`;
  const s=SNAP[k],c=CTX[k];if(!s)return`<div class="card ov"><b>${k}</b><div class="${ERR[k]?'dn':'mu'}">${ERR[k]||'Loading…'}</div></div>`;
  return`<div class="card ov ${FILT===k?'sel':''}" onclick="FILT='${k}';renderAll()"><b>${k}</b> <span class="${cls(s.chg)}">${f2(s.spot)} (${sg(s.chg)}%)</span><div><span class="pill ${c.regime==='UPTREND'?'up':c.regime==='DOWNTREND'?'dn':'warn'}">${c.regime}</span> <span class="mu">bias ${sg(c.bias)} · tech ${sg(c.tech)} · struct ${sg(c.fund)}</span></div>
  <div class="mu" style="font-size:12px">VIX ${s.vix.toFixed(1)} · PCR ${c.pcr.toFixed(2)} · MaxPain ${f0(c.mp)} · S ${f0(c.sup)} / R ${isFinite(c.res)?f0(c.res):'–'} · exp ${s.exp} (${s.dte.toFixed(1)}d)</div></div>`}).join('')+'</div>';
 for(const k in IDX){if(FILT!=='ALL'&&FILT!==k)continue;const c=CTX[k];if(!c)continue;h+=`<div class="sec">${k} auto picks <span class="mu" style="font-weight:400;font-size:12px">— ${c.rej} strikes rejected by filters</span></div>`;
  if(!c.picks.length){h+=`<div class="card mu">${c.regime==='SIDEWAYS'?'Sideways regime — long-premium buying disabled (theta drag). No pick.':'No strike passed every check right now.'}</div>`;continue}
  h+='<div class="grid">'+c.picks.map((p,i)=>{const dup=TR.some(t=>t.status==='OPEN'&&t.sym===p.o.sym),o=p.o;return`<div class="card"><div style="display:flex;justify-content:space-between"><b>BUY ${k} ${p.K} ${p.side}</b><span class="badge" style="background:#10311f;color:#22c55e">${p.score}/100</span></div>
  <div class="mu" style="font-size:12px">${o.sym} · exp ${SNAP[k].exp}</div><div class="kv"><div><span>Entry (LTP)</span>₹${f2(o.ltp)}</div><div><span>Stop</span><b class="dn">₹${f2(p.sl)}</b></div><div><span>Target</span><b class="up">₹${f2(p.tgt)}</b></div><div><span>Qty</span>${CFG.lots[k]*CFG.lotsize[k]}</div>
  <div><span>Delta</span>${Math.abs(o.delta).toFixed(2)}</div><div><span>IV</span>${o.iv.toFixed(1)}%</div><div><span>OI</span>${f0(o.oi)}</div><div><span>Breakeven</span>${f0(p.be)}</div></div>
  <div>${p.chk.map(x=>`<span class="chk">✓ ${x[0]}</span>`).join('')}</div><ul>${p.why.map(w=>`<li>${w}</li>`).join('')}</ul><button class="p" ${dup?'disabled':''} onclick="addTrade('${k}',${i})">${dup?'In paper trades':'+ Add to Paper Trading'}</button></div>`}).join('')+'</div>'}
 return h+'<p class="note">Picks surface only if all six checks pass: regime, technical (EMA20/50, RSI, momentum), PCR/OI structure incl. OI walls, liquidity, theta/IV cost, and breakeven within the 1σ expected move. This is decision-support, not advice.</p>'}
function vPaper(){const op=TR.filter(t=>t.status==='OPEN'),cs=TR.filter(t=>t.status!=='OPEN'),sum=a=>a.reduce((x,t)=>{const p=pnl(t);x.net+=p.net;x.fee+=p.fee;x.g+=p.g;return x},{net:0,fee:0,g:0}),o=sum(op),c=sum(cs),all=o.net+c.net;
 const row=t=>{const p=pnl(t),tip=`Buy: brokerage ${f2(p.fb.b)}, txn ${f2(p.fb.txn)}, SEBI ${f2(p.fb.sebi)}, GST ${f2(p.fb.gst)}, stamp ${f2(p.fb.st)}\nSell: brokerage ${f2(p.fs.b)}, STT ${f2(p.fs.stt)}, txn ${f2(p.fs.txn)}, SEBI ${f2(p.fs.sebi)}, GST ${f2(p.fs.gst)}`;
  return`<tr><td><b>${t.idx} ${t.K} ${t.type}</b><div class="mu" style="font-size:11px">${t.exp} · ${new Date(t.ts).toLocaleString()}${t.why?' · '+t.why:''}</div></td><td>${t.qty}</td><td>${f2(t.entry)}</td><td>${f2(p.ex)}</td><td class="dn">${f2(t.sl)}</td><td class="up">${f2(t.tgt)}</td><td class="${cls(p.g)}">${sg(p.g)}</td><td title="${tip}" style="cursor:help">${f2(p.fee)}</td><td class="${cls(p.net)}"><b>${sg(p.net)}</b></td>
  <td>${t.status==='OPEN'?`<button onclick="closeTrade(${t.id})">Close</button> `:'<span class="mu">closed</span> '}<button class="d" onclick="delTrade(${t.id})">Remove</button></td></tr>`};
 const tbl=a=>a.length?`<div class="sc"><table><tr><th>Instrument</th><th>Qty</th><th>Entry</th><th>LTP / Exit</th><th>SL</th><th>Target</th><th>Gross P&amp;L</th><th>Angel fees</th><th>Net P&amp;L</th><th></th></tr>${a.map(row).join('')}</table></div>`:'<div class="card mu">None</div>';
 return`<div class="grid"><div class="card"><span class="mu">Net P&amp;L (all)</span><br><b class="${cls(all)}" style="font-size:20px">₹${sg(all)}</b></div><div class="card"><span class="mu">Open net (after est. exit fees)</span><br><b class="${cls(o.net)}">₹${sg(o.net)}</b></div><div class="card"><span class="mu">Realized net</span><br><b class="${cls(c.net)}">₹${sg(c.net)}</b></div><div class="card"><span class="mu">Total fees (entry+exit)</span><br><b>₹${f2(o.fee+c.fee)}</b></div></div>
 <div class="sec">Open positions</div>${tbl(op)}<div class="sec">Closed <button class="d" style="float:right" onclick="if(confirm('Remove ALL paper trades?')){TR=[];save();renderAll()}">Clear all</button></div>${tbl(cs)}<p class="note">Open P&amp;L deducts entry fees plus estimated exit fees at current LTP. Hover the fees cell for the breakdown. Positions auto-close at stop/target.</p>`}
function vSet(){const F=CFG.fee,inp=(id,l,v,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" value="${v}">`;
 return`<div class="grid"><div class="card"><b>Angel One SmartAPI</b>${inp('ak','API key (private key)',CFG.apiKey)}${inp('cc','Client code',CFG.client)}${inp('pin','PIN / password','','password')}${inp('otp','TOTP (6-digit)','')}${inp('px','Optional proxy base URL (if browser CORS blocks)',CFG.proxy)}
 <p><button class="p" onclick="CFG.proxy=$('#px').value.trim();connect()">Connect &amp; go live</button> <button onclick="MODE='demo';DB=null;MSG='';renderAll();refresh()">Use demo data</button></p>
 <label>Or load OpenAPIScripMaster.json manually</label><input type="file" accept=".json" onchange="loadFile(this)"><p class="note">PIN/TOTP are never saved. The JWT lives only in this tab's session. Calls used: loginByPassword, quote (FULL), getCandleData, optionGreeks.</p></div>
 <div class="card"><b>Trade &amp; risk</b>${Object.keys(IDX).map(k=>inp('l_'+k,k+' lots (lot size '+CFG.lotsize[k]+')',CFG.lots[k],'number')).join('')}${inp('sl','Stop-loss % of premium',CFG.sl,'number')}${inp('tg','Target % of premium',CFG.tgt,'number')}${inp('ms','Min score to show (0-100)',CFG.minScore,'number')}${inp('rf','Refresh seconds',CFG.refresh,'number')}</div>
 <div class="card"><b>Fee model (editable)</b>${inp('f_brok','Brokerage ₹ per order',F.brok,'number')}${inp('f_stt','STT % on sell premium',F.stt,'number')}${inp('f_txn','Exchange txn % (premium)',F.txn,'number')}${inp('f_sebi','SEBI %',F.sebi,'number')}${inp('f_gst','GST % (brokerage+txn+SEBI)',F.gst,'number')}${inp('f_stamp','Stamp duty % (buy)',F.stamp,'number')}<p class="note">Verify against Angel One's current brokerage page and NSE circulars — STT and exchange rates change. Default lot sizes are also editable; live mode overwrites them from the scrip master.</p></div></div>
 <p><button class="p" onclick="saveSet()">Save settings</button></p>`}
function saveSet(){const n=id=>+$('#'+id).value;for(const k in IDX)CFG.lots[k]=Math.max(1,n('l_'+k)||1);Object.assign(CFG,{sl:n('sl'),tgt:n('tg'),minScore:n('ms'),refresh:n('rf'),apiKey:$('#ak').value.trim(),client:$('#cc').value.trim(),proxy:$('#px').value.trim()});
 Object.assign(CFG.fee,{brok:n('f_brok'),stt:n('f_stt'),txn:n('f_txn'),sebi:n('f_sebi'),gst:n('f_gst'),stamp:n('f_stamp')});save();resched();MSG='Settings saved.';renderAll(1);refresh()}
try{JWT=sessionStorage.getItem('oap_jwt')}catch(e){}
renderAll();refresh();resched();
</script></body></html>
